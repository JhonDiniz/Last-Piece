<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c1438">
  <meta name="description" content="Reino Gelatina — RPG idle de uma gosma rei que defende seu reino. Jogue no navegador ou instale como app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reino Gelatina">
  <title>Reino Gelatina</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <div class="clip">
        <canvas id="scene"></canvas>
        <div id="hud"></div>
        <div id="side" class="side"></div>
        <div id="dock"></div>
        <div id="fx"></div>
      </div>
      <div id="power"></div>
    </div>
    <div id="panel"><div id="list"></div><div class="listfoot"></div></div>
    <nav id="nav"></nav>
    <div id="screens"></div>
    <div id="modals"></div>
    <div id="toasts"></div>
  </div>
  <div id="boot">
    <svg class="logo" viewBox="0 0 140 130"><path d="M 26 124 C 12 124 8 112 12 100 C 18 68 38 38 70 38 C 102 38 122 68 128 100 C 132 112 128 124 114 124 Z" fill="#68dd8c" stroke="#2a1a3e" stroke-width="5"/><ellipse cx="64" cy="84" rx="6.8" ry="9.6" fill="#2a1a3e"/><ellipse cx="94" cy="84" rx="6.8" ry="9.6" fill="#2a1a3e"/><circle cx="66" cy="80" r="2.9" fill="#fff"/><circle cx="96" cy="80" r="2.9" fill="#fff"/><path d="M 73 97 Q 79 103 85 97" fill="none" stroke="#2a1a3e" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="46" cy="62" rx="15" ry="8.5" fill="#fff" opacity=".8" transform="rotate(-38 46 62)"/><g transform="translate(84 37) rotate(14)"><path d="M -17 7 L -17 -9 L -9 -1 L 0 -14 L 9 -1 L 17 -9 L 17 7 Z" fill="#ffcc3a" stroke="#2a1a3e" stroke-width="3.6" stroke-linejoin="round"/></g></svg>
    <h1>Reino <span>Gelatina</span></h1>
    <div class="bar"><i id="bootbar"></i></div>
    <p id="bootmsg">Preparando a geleia…</p>
  </div>
  <noscript><p style="color:#fff;text-align:center">Ative o JavaScript para jogar.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
