<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c1438">
  <meta name="description" content="Reino Gelatina — RPG idle de uma gosma rei que defende seu reino. Jogue no navegador ou instale como app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reino Gelatina">
  <title>Reino Gelatina</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <div class="clip">
        <canvas id="scene"></canvas>
        <div id="hud"></div>
        <div id="side" class="side"></div>
        <div id="dock"></div>
        <div id="fx"></div>
      </div>
      <div id="power"></div>
    </div>
    <div id="panel"><div id="list"></div><div class="listfoot"></div></div>
    <nav id="nav"></nav>
    <div id="screens"></div>
    <div id="modals"></div>
    <div id="toasts"></div>
  </div>
  <div id="boot">
    <svg class="logo" viewBox="0 0 140 130"><path d="M 34 78 Q 34 26 70 26 Q 106 26 106 78 Z" fill="#f5cf66" stroke="#2a1a3e" stroke-width="5" stroke-linejoin="round"/><rect x="36" y="58" width="68" height="13" rx="4" fill="#d8384a"/><ellipse cx="70" cy="82" rx="62" ry="17" fill="#f2c45a" stroke="#2a1a3e" stroke-width="5"/><path d="M 14 82 Q 70 98 126 82" fill="none" stroke="#c99a33" stroke-width="3" opacity=".7"/><ellipse cx="52" cy="42" rx="9" ry="5" fill="#fff" opacity=".7" transform="rotate(-30 52 42)"/></svg>
    <h1>Reino <span>Gelatina</span></h1>
    <div class="bar"><i id="bootbar"></i></div>
    <p id="bootmsg">Içando as velas…</p>
  </div>
  <noscript><p style="color:#fff;text-align:center">Ative o JavaScript para jogar.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
